<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedankt — Krillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12142B; --ink-soft:#3B3D57; --paper:#F6F5F1; --paper-raised:#FFFFFF;
    --line:#E4E2DA; --coral:#FF4B3E; --teal:#1FB6A4; --teal-dim:#DFF5F1;
    --mono:'IBM Plex Mono', monospace; --disp:'Space Grotesk', sans-serif; --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.6;
       min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{
    max-width:460px; width:100%; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:16px; padding:40px 36px; text-align:center;
  }
  .logo{font-family:var(--disp); font-weight:700; font-size:18px; display:flex; align-items:center;
        justify-content:center; gap:8px; margin-bottom:28px;}
  .logo-dot{width:9px; height:9px; background:var(--coral); border-radius:50%;}
  .check{
    width:56px; height:56px; border-radius:50%; background:var(--teal-dim); color:var(--teal);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
    font-size:26px; font-weight:700;
  }
  h1{font-family:var(--disp); font-weight:700; font-size:24px; margin-bottom:12px; letter-spacing:-0.01em;}
  p{color:var(--ink-soft); font-size:14.5px; margin-bottom:8px;}
  .note{
    font-family:var(--mono); font-size:12px; color:var(--ink-soft);
    background:var(--paper); border-radius:8px; padding:12px 14px; margin-top:24px;
  }
  .back{
    display:inline-block; margin-top:24px; font-size:13.5px; color:var(--ink);
    text-decoration:none; border-bottom:1px solid var(--ink);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>Krillo</div>
    <div class="check">&#10003;</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="note">{{ note }}</div>
    <a class="back" href="/">Terug naar Krillo</a>
  </div>
</body>
</html>
